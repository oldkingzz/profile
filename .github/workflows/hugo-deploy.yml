name: Deploy portfolio to Pages

on:
  push:
    branches:
      - main
      - agent/public-portfolio-redesign

  # 允许你从 Actions 标签页手动运行
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Build interactive static site
        working-directory: site
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /profile
        run: npm run build && npm run export:pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
